# ================================================================
# Phase-6 Ablation: B2 — FULL AUX (Haze + Visibility + Uncertainty)
# No Phase-2 embedding. 10-epoch diagnostic ablation.
# Evaluates combined stabilizing regularizers.
# ================================================================

experiment_name: "B2_full_aux"

# -------------------------
# Model Configuration
# -------------------------
use_phase2_embedding: false      # <— no 524D engineered vector
use_haze_head: true
use_vis_head: true
use_uncertainty: true

# -------------------------
# Training Configuration
# -------------------------
max_epochs: 10
early_stop_patience: 3
batch_size: 16
learning_rate: 1e-4
weight_decay: 1e-5

# -------------------------
# Data Configuration
# -------------------------
splits_dir: "splits"
metadata_csv: "metadata_image_only.csv"

phase2_embeddings_npy: "phase2_features_final_image_only.npy"
phase2_index_csv: "phase2_index_image_only.csv"

# -------------------------
# Logging / Output
# -------------------------
save_dir: "results/ablation/B2_full_aux"
manifest_path: "run_manifest.json"
