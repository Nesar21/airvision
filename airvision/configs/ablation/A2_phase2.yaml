# ==========================================================
# Phase-6 Ablation: A2 — Backbone + 524D Phase-2 Embedding
# No auxiliary heads. 10-epoch diagnostic ablation.
# ==========================================================

experiment_name: "A2_phase2"

# -------------------------
# Model configuration
# -------------------------
use_phase2_embedding: true       # <— key difference from A1
use_haze_head: false
use_vis_head: false
use_uncertainty: false

# -------------------------
# Training configuration
# -------------------------
max_epochs: 10
early_stop_patience: 3
batch_size: 16
learning_rate: 1e-4
weight_decay: 1e-5

# -------------------------
# Data configuration
# -------------------------
splits_dir: "splits"
metadata_csv: "metadata_image_only.csv"

# Phase-2 embedding files (already created in Phase 2)
phase2_embeddings_npy: "phase2_features_final_image_only.npy"
phase2_index_csv: "phase2_index_image_only.csv"

# -------------------------
# Logging / Output
# -------------------------
save_dir: "results/ablation/A2_phase2"
manifest_path: "run_manifest.json"
